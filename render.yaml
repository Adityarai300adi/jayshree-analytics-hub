
services:
  - type: web
    name: jayshree-analytics-hub
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python app.py

    envVars:
      - key: JP_HOST
        value: 0.0.0.0

      - key: JP_COOKIE_SECURE
        value: "true"

      - key: JP_REGISTRATION
        value: "off"

      - key: JP_OPEN_BROWSER
        value: "0"

      - key: JP_ADMIN_PASSWORD
        sync: false
